<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <ol type="A">
        <li>Hi</li>
        <ol type="i">                     <!--We can do nesting also means in list item we can add another ol(ordered list)-->
            <li>Level A</li>
            <li>level B</li>
        </ol>
        <li>By</li>
    </ol>

    <ul>
        <li>Apple</li>
        <li>Orange</li>
    </ul>
</body>
</html>
