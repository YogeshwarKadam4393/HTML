<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Table</title>
</head>
<body>

        <caption>My Information</caption>       <!--Caption are also used to define table name -->
        
         <tr>
            <th colspan="2"> Tech I am Good at</th>  <!--colspan is used to add data in how many columns -->
        </tr>

        <tr>                               <!--tr is Table Row-->>

            <th>competancy</th>

        </tr>

        <tr>   
        <td>Java</td>                       <!--td is Tablw Data-->>
        <td>1 Months</td>
        <td>7/10</td>
        </tr>

        <tr>
         <td>Python</td>
        <td>1 Months</td>
        <td>7/10</td>
        </tr>

    </table>
</body>
</html>
