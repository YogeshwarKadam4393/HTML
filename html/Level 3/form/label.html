<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="/contact-me">          <!--form is used to create a form where we can get user input-->
                                     <!--action is used to store the user data after submitting any information-->
        <label for="email">UserName : </label>
        <input type="text" placeholder="email" required="true"><br>    <!--placeholder means at the text place we can see what to put as input-->
        
        <label for="user_password">Password : </label>
        <input type="user_password" placeholder="Password" required="true"><br>
        <input type="submit">
    </form>
</body>
</html>
