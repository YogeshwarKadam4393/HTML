<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <form action="/contact-me.php" method="post">          <!--form is used to create a form where we can get user input-->
                                     <!--action is used to store the user data after submitting any information-->

        UserName : <input type="text" placeholder="Enter Your Name" required="true"><br>    <!--placeholder means at the text place we can see what to put as input-->
        Password : <input type="password" placeholder="Enter Password"><br>
        <input type="submit" value="Submit">
    </form>
</body>
